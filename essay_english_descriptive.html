<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Essay - Descriptive English Prep Dashboard</title>
    <style>
        /* --- GLOBAL RESET & LAYOUT --- */
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh; 
            overflow: hidden;
            background-color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        header {
            background-color: #3867d6; 
            color: white;
            height: 50px;
            flex: 0 0 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 3px solid #204da3;
            z-index: 10;
        }

        .exam-title { font-size: 1.1rem; font-weight: bold; }

        .timer {
            background: white;
            color: black;
            padding: 5px 15px;
            font-weight: bold;
            border: 2px solid #000;
            font-family: monospace;
            font-size: 1.2rem;
        }

        .timer-danger { background: #ff0000; color: white; border-color: white; }

        /* --- MAIN CONTAINER --- */
        .container {
            display: flex;
            flex: 1; 
            width: 100%;
            overflow: hidden;
        }

        /* --- LEFT PANEL --- */
        .left-panel {
            width: 40%;
            background: #f4f6f9;
            border-right: 2px solid #888;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        .q-label { font-weight: bold; text-decoration: underline; margin-bottom: 5px; font-size: 0.9rem; }

        select.topic-dropdown {
            width: 100%;
            padding: 6px;
            margin-bottom: 10px;
            border: 1px solid #777;
            background: #fff;
            flex-shrink: 0; 
        }

        .question-box {
            background: white;
            border: 1px solid #aaa;
            padding: 15px;
            flex: 1; 
            overflow-y: auto;
            font-family: 'Times New Roman', Times, serif;
            font-size: 18px;
            line-height: 1.4;
        }

        /* --- RIGHT PANEL --- */
        .right-panel {
            width: 60%;
            background: #fff;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        .input-label { font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }

        textarea {
            flex: 1; 
            width: 100%;
            resize: none;
            padding: 10px;
            font-family: 'Verdana', sans-serif;
            font-size: 14px;
            border: 1px solid #000;
            outline: none;
            overflow-y: auto;
        }

        textarea:focus { border: 2px solid #3867d6; }

        /* --- FOOTER --- */
        footer {
            background: #e0e0e0;
            border-top: 1px solid #999;
            height: 50px;
            flex: 0 0 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 10;
        }

        .word-count-box { font-weight: bold; font-size: 0.9rem; color: #333; }

        .action-buttons button {
            padding: 6px 15px;
            margin-left: 5px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #555;
            font-size: 0.85rem;
        }

        .btn-save { background: #4b7bec; color: white; }
        .btn-save:active { background: #2f5bb7; }
        
        .btn-submit { background: #20bf6b; color: white; }
        
        .btn-clear { background: #eb3b5a; color: white; }

        /* NEW AI BUTTON STYLE */
        .btn-ai { 
            background: #8e44ad; /* Purple */
            color: white; 
            border: 1px solid #5e2d79;
        }
        .btn-ai:hover { background: #9b59b6; }
        .btn-ai:active { background: #732d91; }

        /* --- RESPONSIVENESS --- */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .left-panel { width: 100%; height: 35%; border-right: none; border-bottom: 2px solid #888; }
            .right-panel { width: 100%; height: 65%; }
            .exam-title { font-size: 0.9rem; }
            .timer { font-size: 1rem; padding: 2px 8px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="exam-title">Essay Writing</div>
        <div id="timer" class="timer">15:00</div>
    </header>

    <div class="container">
        <div class="left-panel">
            <div class="q-label">Select Question:</div>
            <select id="topicSelector" class="topic-dropdown" onchange="displayTopic()">
                <option value="" selected disabled>-- Select Topic --</option>
            </select>
            
            <div class="q-label">Question Text:</div>
            <div class="question-box" id="questionText">
                <p>Please select a topic from the dropdown menu above.</p>
                <p><strong>Instructions:</strong></p>
                <ul>
                    <li>Word Limit: 250 - 275 words.</li>
                    <li>Time Limit: 15 Minutes.</li>
                    <li>Spell-check is <strong>disabled</strong>.</li>
                </ul>
            </div>
        </div>

        <div class="right-panel">
            <div class="input-label">Type your answer here:</div>
            <textarea id="essayArea" 
                spellcheck="false" 
                autocomplete="off" 
                onpaste="return false;" 
                oncopy="return false;" 
                oncut="return false;"
                placeholder="Start typing..."></textarea>
        </div>
    </div>

    <footer>
        <div class="word-count-box">
            Word Count: <span id="wordCount">0</span>
        </div>
        <div class="action-buttons">
            <button class="btn-ai" onclick="copyForAI()">Copy to Evaluate</button>
            
            <button class="btn-clear" onclick="clearResponse()">Clear</button>
            <button class="btn-save" onclick="saveResponse()">Save</button>
            <button class="btn-submit" onclick="submitTest()">Submit</button>
        </div>
    </footer>

    <script>
        // --- DATA ---
        const topics = [
            "1. How Environmental, Social and Governance (ESG) norms help global business prospects. Comment.",
            "2. Discuss how organisations and management can nurture organisational culture.",
            "3. What role can banks play in promoting social healthcare expenditure?",
            "4. \"A machine can replace five average human beings, but five machines cannot replace one smart human.\" Elaborate.",
            "5. Mental health and its impacts should be spoken about.",
            "6. Role of banks in financial literacy.",
            "7. Techno-stress and its impact on students and teachers in the education sector.",
            "8. Asset reconstruction in companies.",
            "9. Importance of teamwork in an organisation.",
            "10. Pros and cons of mergers and acquisitions.",
            "11. Role of technology in detecting and preventing financial frauds.",
            "12. Fake news and how to identify it.",
            "13. Discuss the impact of e-commerce on businesses.",
            "14. Transitioning to a cashless economy. Explain.",
            "15. Sustainability as a strategic imperative for businesses in a globalised economy.",
            "16. Integrating environmental, social and governance considerations into business decision-making.",
            "17. Long-term value creation through responsible business practices.",
            "18. From compliance to competitiveness: The evolving role of sustainability in business.",
            "19. Building and sustaining a strong organisational culture in modern enterprises.",
            "20. The role of leadership in shaping ethical and inclusive work cultures.",
            "21. Organisational values as drivers of employee engagement and performance.",
            "22. Managing cultural change in large organisations: Opportunities and challenges.",
            "23. Financial institutions as catalysts for social sector development.",
            "24. The role of banks in supporting healthcare and social infrastructure.",
            "25. Balancing commercial objectives with developmental responsibilities in banking.",
            "26. Expanding access to finance to strengthen social outcomes.",
            "27. Technology and human intelligence: Complementarity in the modern workplace.",
            "28. Automation and employment: Redefining the nature of work.",
            "29. Why human creativity and judgment remain central in a technology-driven world.",
            "30. Digital transformation and its implications for the workforce.",
            "31. Institutions as agents of social and economic transformation.",
            "32. Balancing efficiency with empathy in contemporary organisations.",
            "33. Economic growth and social development: Exploring the interdependence.",
            "34. Purpose-driven organisations in a competitive economy."
        ];

        // --- INIT ---
        const selector = document.getElementById('topicSelector');
        topics.forEach((topic, index) => {
            let opt = document.createElement('option');
            opt.value = index;
            opt.innerHTML = topic.length > 80 ? topic.substring(0, 80) + "..." : topic; 
            selector.appendChild(opt);
        });

        const textArea = document.getElementById('essayArea');
        const countSpan = document.getElementById('wordCount');
        const timerDisplay = document.getElementById('timer');
        let timeLeft = 15 * 60; 
        let timerInterval;

        function displayTopic() {
            const index = selector.value;
            document.getElementById('questionText').innerHTML = "<strong>Question:</strong><br><br>" + topics[index];
            textArea.focus();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                timerDisplay.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                if (timeLeft < 120) timerDisplay.classList.add('timer-danger');
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    textArea.disabled = true;
                    alert("Time Up! Test Auto-Submitted.");
                }
                timeLeft--;
            }, 1000);
        }

        textArea.addEventListener('input', () => {
            const val = textArea.value.trim();
            const words = val === '' ? 0 : val.split(/\s+/).length;
            countSpan.innerText = words;
        });

        function saveResponse() {
            const btn = document.querySelector('.btn-save');
            const originalText = btn.innerText;
            btn.innerText = "Saved!";
            setTimeout(() => btn.innerText = originalText, 1000);
        }

        function clearResponse() {
            if(confirm("Are you sure you want to clear your response?")) {
                textArea.value = "";
                countSpan.innerText = "0";
            }
        }

        function submitTest() {
            if(confirm("Are you sure you want to submit?")) {
                clearInterval(timerInterval);
                textArea.disabled = true;
                alert("Test Submitted Successfully!");
            }
        }

        // --- NEW AI COPY FUNCTION ---
        function copyForAI() {
            const topicIndex = document.getElementById('topicSelector').value;
            const essayText = document.getElementById('essayArea').value;

            // Validation
            if (!topicIndex || topicIndex === "") {
                alert("Please select a topic first.");
                return;
            }
            if (essayText.trim().length < 10) {
                alert("Please write an essay first.");
                return;
            }

            const fullTopic = topics[topicIndex];
            
            // This is the STRICT System Prompt we designed earlier
            const promptPayload = `
**System Role:** You are the automated evaluation algorithm (AES) for the English Descriptive Exam. You are NOT a writing coach; you are a scoring engine. Your grading is binary, strict, and based on pattern matching.

**Exam Constraints:**
* **Strict Word Count:** 250–275 words. (Absolute hard limit. <250 or >275 results in immediate deduction).
* **Language:** British English (India Standard). American spelling (e.g., 'color', 'analyze') is treated as a Spelling Error.
* **Tone:** Formal, Bureaucratic, Objective.

**Scoring Algorithm (Total: 30 Marks):**

**1. Mechanics & Accuracy (10 Marks)**
* *Logic:* Subtract 1 mark for every unique spelling error or grammatical fault.
* *Check:* Subject-Verb Agreement, Article usage (a/an/the), Prepositions, and Punctuation.
* *Critical:* Scan for Americanisms (z vs s) and flag them as errors.

**2. Content & Keyword Latency (10 Marks)**
* *Logic:* Perform a Keyword Match. Does the essay contain specific domain-specific terminology relevant to the Topic provided?
* *Check:* If the topic is financial, look for words like "Regulation," "Economy," "Investor," "Mitigation."
* *Penalty:* Generic, vague sentences (e.g., "This is a very good thing") receive 0 value.

**3. Coherence & Structure (5 Marks)**
* *Logic:* Detect paragraph breaks and transitional signposts.
* *Check:* Must detect exactly 3 or 4 distinct paragraphs (Intro, Body 1, Body 2, Conclusion).
* *Check:* Must detect connectors: *However, Therefore, Consequently, Furthermore, In conclusion.*

**4. Readability & Complexity (5 Marks)**
* *Logic:* Sentence variety check.
* *Check:* Are sentences too long (>30 words) or too simple?
* *Penalty:* Repetitive sentence starts (e.g., starting 3 sentences with "The...").

**Input Data:**
**Topic:** ${fullTopic}
**Essay:** ${essayText}

**Output Report (Generate strictly in this format):**
**[1] DATA VALIDATION**
* **Word Count:** [X] / 275
* **Paragraph Count:** [X] (Pass if 3 or 4)
* **Status:** [PASS / FAIL]

**[2] ERROR LOG (Mechanical)**
* *Spelling Errors (British English check):* [List all or "None"]
* *Grammar Faults:* [List all specific errors]

**[3] KEYWORD ANALYSIS**
* *Topic Keywords Detected:* [List top 5 domain-specific words used]
* *Lacking Keywords:* [Suggest 3 professional terms missing from this essay]

**[4] STRUCTURE CHECK**
* *Transition Words Used:* [List them]
* *Flow Rating:* [High/Medium/Low]

**[5] FINAL COMPUTED SCORE**
* **[X] / 30**
            `;

            // Copy to Clipboard API
            navigator.clipboard.writeText(promptPayload).then(() => {
                const btn = document.querySelector('.btn-ai');
                const originalText = btn.innerText;
                btn.innerText = "Prompt Copied! ✅";
                setTimeout(() => {
                    btn.innerText = originalText;
                }, 2000);
            }).catch(err => {
                alert("Failed to copy. Browser permission might be denied.");
                console.error('Async: Could not copy text: ', err);
            });
        }

        // Security Locks
        document.addEventListener('contextmenu', event => event.preventDefault());
        
        // Start
        window.onload = startTimer;
    </script>
</body>
</html>
